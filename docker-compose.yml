services:
  # -------------------------------------------------------------
  # PostgreSQL 15 - Primary Relational Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: bottleneck_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-bottleneck_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bottleneck_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bottleneck-network

  # -------------------------------------------------------------
  # Redis 7 - Cache & BullMQ Queue Broker
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bottleneck_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bottleneck-network

  # -------------------------------------------------------------
  # Backend - Node.js + Express + Prisma + BullMQ
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: bottleneck_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-bottleneck_db}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONDAY_SIGNING_SECRET: ${MONDAY_SIGNING_SECRET:-development_signing_secret_test}
      MONDAY_API_TOKEN: ${MONDAY_API_TOKEN:-mock_or_actual_monday_api_token}
      MONDAY_CLIENT_ID: ${MONDAY_CLIENT_ID:-}
      MONDAY_CLIENT_SECRET: ${MONDAY_CLIENT_SECRET:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bottleneck-network

  # -------------------------------------------------------------
  # Frontend - React + Vite + Monday Vibe Design System
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: bottleneck_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${PORT:-8080}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bottleneck-network

  # -------------------------------------------------------------
  # Caddy 2 - Automated HTTPS Reverse Proxy & SSL Certificates
  # -------------------------------------------------------------
  caddy:
    image: caddy:alpine
    container_name: bottleneck_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - bottleneck-network

volumes:
  postgres_data:
    name: bottleneck_postgres_data
  redis_data:
    name: bottleneck_redis_data
  caddy_data:
    name: bottleneck_caddy_data
  caddy_config:
    name: bottleneck_caddy_config

networks:
  bottleneck-network:
    name: bottleneck_network
    driver: bridge
